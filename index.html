      coso1.innerText = `+`;
      coso.appendChild(coso1);
      coso.addEventListener("click",()=>{
        mas(p);
      });
      const coso2 = document.createElement("div");
      const coso21 = document.createElement("span");
      coso21.innerText = `-`;
      coso2.appendChild(coso21);
      coso2.addEventListener("click",()=>{

    }
  }
  function mas(x) {
    if (productos[x][2] >= 100) return;
    productos[x][2]++;
    document.getElementById(`p${x}`).innerHTML = `${productos[x][2]}`;
    if (muestra) {tocadorPorHerencia();}
  }
  function menos(x) {
    if (productos[x][2] <= 0) return;
    productos[x][2]--;
    document.getElementById(`p${x}`).innerHTML = `${productos[x][2]}`;
    if (muestra) {tocadorPorHerencia();}
  }
  function tocadorPorHerencia() {
    document.getElementById("carrito").replaceChildren();
    whore = 0;
    for (let i=0; i<productos.length; ++i) {

      whore += productos[i][2]*productos[i][3];

      netanyahu.appendChild(netanyahu2);

      netanyahu3.innerHTML = `${productos[i][2]}`;
      netanyahu.appendChild(netanyahu3);
      const netanyahu4 = document.createElement("span");
      netanyahu4.innerHTML = `${productos[i][0]}`;
      netanyahu.appendChild(netanyahu4);
      const netanyahu5 = document.createElement("span");
      netanyahu5.innerHTML = `$${productos[i][3]}`;
      netanyahu.appendChild(netanyahu5);
      document.getElementById("carrito").appendChild(netanyahu);
    }
    document.getElementById("cuenta").innerHTML = `$${whore}`;
  }
  document.getElementById("flechita").addEventListener("click", ()=>{

    if (!!!muestra === false) {tocadorPorHerencia();}
    intervaloPagar = setInterval(()=>{
      momentoIntervalo = true;
      if (muestra) {
        ancho++;
        if (ancho >= 30) {momentoIntervalo = false; clearInterval(intervaloPagar);}
      } else {
        ancho--;
        if (ancho <= 0) {momentoIntervalo = false; clearInterval(intervaloPagar);}
      }
      document.querySelector(".contenedor > :nth-child(3)").style.left = `${96-ancho}vw`;

  })
